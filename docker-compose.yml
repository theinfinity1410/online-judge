  backend:
    image: theinfinity1410/local-node-backend:latest  
    container_name: node-backend
    ports:
      - "3000:3000"
    environment:
      # COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_DIALECT: ${DB_DIALECT:-postgres}
      # SSL Configuration (provide either content or path variables)
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-}
      DB_SSL_KEY: ${DB_SSL_KEY:-}
      DB_SSL_KEY_PATH: ${DB_SSL_KEY_PATH:-}
      DB_SSL_CERT: ${DB_SSL_CERT:-}
      DB_SSL_CERT_PATH: ${DB_SSL_CERT_PATH:-}
    networks: [judge_net]
  server:
    image: theinfinity1410/local-flask:latest
    container_name: flask-server
    restart: always
    command: python workers/server.py
    environment:
      PYTHONPATH: /app
    networks: [judge_net]

  worker:
    image: theinfinity1410/local-flask:latest
    container_name: flask-worker
    restart: always
    command: >
      celery -A workers.tasks worker
            --loglevel=${LOG_LEVEL:-DEBUG}
            --concurrency=3
            --queues=submitQueue,runQueue,runSystemQueue
    depends_on:
      - redis
    environment:
      HOST_MACHINE_BASE_DIR: /home/astravps/OJ  # Change this to your actual path  
      PYTHONPATH: /app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_BROKER_URL: redis://redis:6379/0
      REDIS_BACKEND_URL: redis://redis:6379/0
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
    working_dir: /app
    volumes:
      - ./submissions:/app/submissions:z
      - /var/run/docker.sock:/var/run/docker.sock  
    networks: [judge_net]

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks: [judge_net]

networks: 
  judge_net:

volumes:
  redisdata: